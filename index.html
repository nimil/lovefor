<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>我们的一家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #f48fb1 60%, #f06292 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #4a2c3a;
        }

        .hearts {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .heart {
            position: absolute;
            bottom: -60px;
            font-size: 20px;
            color: rgba(255,255,255,0.35);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative; z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeInDown 1s ease both;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 300;
            color: #fff;
            text-shadow: 0 2px 12px rgba(180,50,80,0.25);
            letter-spacing: 4px;
        }
        .header .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            letter-spacing: 2px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(180,50,80,0.12);
            transition: transform 0.3s ease;
            animation: fadeInUp 0.8s ease both;
        }
        .card:hover { transform: translateY(-3px); }
        .card:nth-child(2) { animation-delay: 0.08s; }
        .card:nth-child(3) { animation-delay: 0.16s; }
        .card:nth-child(4) { animation-delay: 0.24s; }
        .card:nth-child(5) { animation-delay: 0.32s; }
        .card:nth-child(6) { animation-delay: 0.4s; }
        .card:nth-child(7) { animation-delay: 0.48s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 12px;
        }
        .card-title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #c2185b;
        }
        .card-date {
            text-align: center;
            font-size: 13px;
            color: #a0607a;
            margin-bottom: 18px;
        }
        .timer-row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .timer-unit {
            text-align: center;
            min-width: 56px;
        }
        .timer-unit .num {
            display: block;
            font-size: 28px;
            font-weight: 700;
            color: #e91e63;
            line-height: 1.1;
        }
        .timer-unit .label {
            font-size: 12px;
            color: #a0607a;
            margin-top: 4px;
        }

        .divider {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 22px;
            margin: 8px 0 20px;
            letter-spacing: 8px;
        }

        .section-title {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            margin-bottom: 16px;
            letter-spacing: 3px;
        }

        .reminder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(180,50,80,0.08);
        }
        .reminder-item:last-child { border-bottom: none; }
        .reminder-info .reminder-name {
            font-size: 15px;
            font-weight: 500;
            color: #4a2c3a;
        }
        .reminder-info .reminder-date {
            font-size: 12px;
            color: #a0607a;
            margin-top: 3px;
        }
        .reminder-days {
            font-size: 14px;
            font-weight: 600;
            color: #e91e63;
            white-space: nowrap;
        }

        .footer {
            text-align: center;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
            letter-spacing: 1px;
            margin-top: 10px;
            animation: fadeInUp 1s ease 0.5s both;
        }
    </style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">
    <div class="header">
        <h1>我们的一家</h1>
        <div class="subtitle">每一天，都是爱的续集</div>
    </div>

    <div class="card">
        <div class="card-icon">❤</div>
        <div class="card-title">恋爱纪念日</div>
        <div class="card-date">2023 年 8 月 18 日</div>
        <div class="timer-row" id="love-timer"></div>
    </div>

    <div class="card">
        <div class="card-icon">💒</div>
        <div class="card-title">结婚纪念日</div>
        <div class="card-date">2025 年 4 月 19 日</div>
        <div class="timer-row" id="marriage-timer"></div>
    </div>

    <div class="card">
        <div class="card-icon">👶</div>
        <div class="card-title">宝贝来到我们身边</div>
        <div class="card-date">2026 年 3 月 4 日 17:08</div>
        <div class="timer-row" id="baby-timer"></div>
    </div>

    <div class="card">
        <div class="card-icon">🎂</div>
        <div class="card-title">爸爸的生日</div>
        <div class="card-date">农历 1995年3月21日</div>
        <div class="timer-row" id="dad-birthday-timer"></div>
    </div>

    <div class="card">
        <div class="card-icon">🎂</div>
        <div class="card-title">妈妈的生日</div>
        <div class="card-date">农历 1994年5月19日</div>
        <div class="timer-row" id="mom-birthday-timer"></div>
    </div>

    <div class="divider">· · ·</div>

    <div class="section-title">下一次纪念日提醒</div>

    <div class="card">
        <div id="reminder-list"></div>
    </div>

    <div class="footer">
        愿岁月温柔，我们一直走下去
    </div>
</div>

<script>
    (function () {
        var container = document.getElementById('hearts');
        var symbols = ['\u2665', '\u2661', '\u2764', '\ud83d\udc95'];
        for (var i = 0; i < 18; i++) {
            var el = document.createElement('span');
            el.className = 'heart';
            el.textContent = symbols[i % symbols.length];
            el.style.left = Math.random() * 100 + '%';
            el.style.fontSize = (14 + Math.random() * 18) + 'px';
            el.style.animationDuration = (8 + Math.random() * 12) + 's';
            el.style.animationDelay = (Math.random() * 10) + 's';
            container.appendChild(el);
        }
    })();

    function renderTimer(containerId, startDate) {
        var container = document.getElementById(containerId);
        var t = new Date() - startDate;
        if (t < 0) t = 0;
        var d = Math.floor(t / 86400000);
        var h = Math.floor(t / 3600000 % 24);
        var m = Math.floor(t / 60000 % 60);
        var s = Math.floor(t / 1000 % 60);
        container.innerHTML =
            '<div class="timer-unit"><span class="num">' + d + '</span><span class="label">天</span></div>' +
            '<div class="timer-unit"><span class="num">' + pad(h) + '</span><span class="label">时</span></div>' +
            '<div class="timer-unit"><span class="num">' + pad(m) + '</span><span class="label">分</span></div>' +
            '<div class="timer-unit"><span class="num">' + pad(s) + '</span><span class="label">秒</span></div>';
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    // 农历转公历 (1900-2100)
    var lunarInfo = [
        0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
        0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
        0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
        0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
        0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
        0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
        0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
        0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
        0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
        0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
        0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
        0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
        0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
        0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
        0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
        0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
        0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
        0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
        0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
        0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
        0x0d520
    ];

    function lYearDays(y) {
        var sum = 348, i;
        for (i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
        return sum + leapDays(y);
    }
    function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
    function leapDays(y) {
        if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
        return 0;
    }
    function monthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

    function lunarToSolar(lYear, lMonth, lDay) {
        var base = new Date(1900, 0, 31);
        var offset = 0, i;
        for (i = 1900; i < lYear; i++) offset += lYearDays(i);
        var lm = leapMonth(lYear);
        for (i = 1; i < lMonth; i++) {
            offset += monthDays(lYear, i);
            if (i === lm) offset += leapDays(lYear);
        }
        offset += lDay - 1;
        return new Date(base.getTime() + offset * 86400000);
    }

    function findNextLunarBirthday(lMonth, lDay) {
        var now = new Date();
        // search from current year to current year + 2
        for (var y = now.getFullYear(); y <= now.getFullYear() + 2; y++) {
            var solar = lunarToSolar(y, lMonth, lDay);
            if (solar > now) {
                var age = y - baseLunarYear;
                return { solar: solar, days: Math.ceil((solar - now) / 86400000), age: age };
            }
        }
        return null;
    }

    var baseLunarYear = 1995; // default for dad

    // 核心日期
    var loveDate    = new Date(2023, 7, 18);           // 2023-08-18
    var marriage    = new Date(2025, 3, 19);            // 2025-04-19
    var baby        = new Date(2026, 2, 4, 17, 8, 0);   // 2026-03-04 17:08

    // 父母农历生日
    var dadLunar  = { year: 1995, month: 3,  day: 21, label: '爸爸' };
    var momLunar  = { year: 1994, month: 5,  day: 19, label: '妈妈' };

    function nextSolarBirthday(lunar) {
        var now = new Date();
        for (var y = now.getFullYear(); y <= now.getFullYear() + 2; y++) {
            var solar = lunarToSolar(y, lunar.month, lunar.day);
            if (solar > now) {
                var age = y - lunar.year;
                return {
                    solar: solar,
                    days: Math.ceil((solar - now) / 86400000),
                    age: age,
                    date: (solar.getMonth() + 1) + '月' + solar.getDate() + '日'
                };
            }
        }
        return null;
    }

    function daysUntilDate(month, day) {
        var now = new Date();
        var target = new Date(now.getFullYear(), month - 1, day);
        if (target <= now) target = new Date(now.getFullYear() + 1, month - 1, day);
        return Math.ceil((target - now) / 86400000);
    }

    function renderReminders() {
        var reminders = [
            { name: '恋爱纪念日', date: '8月18日', days: daysUntilDate(8, 18) },
            { name: '结婚纪念日', date: '4月19日', days: daysUntilDate(4, 19) },
            { name: '宝贝生日', date: '3月4日', days: daysUntilDate(3, 4) },
        ];

        var dadNext = nextSolarBirthday(dadLunar);
        if (dadNext) reminders.push({ name: '爸爸生日', date: '农历' + dadLunar.month + '月' + dadLunar.day + '日（公历' + dadNext.date + '）', days: dadNext.days });

        var momNext = nextSolarBirthday(momLunar);
        if (momNext) reminders.push({ name: '妈妈生日', date: '农历' + momLunar.month + '月' + momLunar.day + '日（公历' + momNext.date + '）', days: momNext.days });

        reminders.sort(function (a, b) { return a.days - b.days; });
        var html = '';
        for (var i = 0; i < reminders.length; i++) {
            var r = reminders[i];
            html += '<div class="reminder-item">' +
                '<div class="reminder-info">' +
                    '<div class="reminder-name">' + r.name + '</div>' +
                    '<div class="reminder-date">' + r.date + '</div>' +
                '</div>' +
                '<div class="reminder-days">还有 ' + r.days + ' 天</div>' +
            '</div>';
        }
        document.getElementById('reminder-list').innerHTML = html;
    }

    function tick() {
        renderTimer('love-timer', loveDate);
        renderTimer('marriage-timer', marriage);
        renderTimer('baby-timer', baby);

        // 父母生日倒计时 — 显示距下次农历生日
        var dadNext = nextSolarBirthday(dadLunar);
        if (dadNext) {
            document.getElementById('dad-birthday-timer').innerHTML =
                '<div class="timer-unit"><span class="num">' + dadNext.days + '</span><span class="label">天</span></div>' +
                '<div class="timer-unit"><span class="num">' + dadNext.age + '</span><span class="label">岁</span></div>' +
                '<div class="timer-unit"><span class="num">' + (dadNext.solar.getMonth() + 1) + '/' + dadNext.solar.getDate() + '</span><span class="label">公历</span></div>';
        }

        var momNext = nextSolarBirthday(momLunar);
        if (momNext) {
            document.getElementById('mom-birthday-timer').innerHTML =
                '<div class="timer-unit"><span class="num">' + momNext.days + '</span><span class="label">天</span></div>' +
                '<div class="timer-unit"><span class="num">' + momNext.age + '</span><span class="label">岁</span></div>' +
                '<div class="timer-unit"><span class="num">' + (momNext.solar.getMonth() + 1) + '/' + momNext.solar.getDate() + '</span><span class="label">公历</span></div>';
        }

        renderReminders();
    }
    tick();
    setInterval(tick, 1000);
</script>

</body>
</html>
